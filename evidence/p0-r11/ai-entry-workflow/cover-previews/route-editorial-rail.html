<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial Monument</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{position:relative;background:#f1eee6;color:#171515;font-family:'Microsoft JhengHei', 'Microsoft JhengHei UI', 'PingFang TC', sans-serif}.stage{--canvas:#f1eee6;--text:#171515;--muted:#68615c;--accent:#d7472f;--surface:#ded8cc;--display:'Microsoft JhengHei', 'Microsoft JhengHei UI', 'PingFang TC', sans-serif;--body:'Microsoft JhengHei', 'Microsoft JhengHei UI', 'PingFang TC', sans-serif;--mono:Menlo, monospace;position:absolute;left:50%;top:50%;width:1600px;height:900px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--stage-scale,1));background:var(--canvas);color:var(--text);font-family:var(--body);transform-origin:center;border:1px solid var(--muted)}.identity{margin:0;font:800 15px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{margin:30px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.055em}.title-line{display:block;white-space:nowrap;line-height:1.25}.subtitle{margin:34px 0 0;color:var(--muted);font-size:26px;line-height:1.45}
.stage{padding:58px 70px}.type-copy{position:absolute;left:70px;top:58px;width:1420px;z-index:2}.type-copy h1{margin-top:118px;font-size:116px;line-height:.94;letter-spacing:-.075em}.type-copy .subtitle{position:absolute;right:10px;top:670px;width:610px;margin:0;text-align:right}.type-monument{position:absolute;inset:0;overflow:hidden;color:transparent;opacity:.58;-webkit-text-stroke:3px var(--accent)}.type-monument::before{content:attr(data-glyphs);position:absolute;display:block;overflow:hidden;font:900 520px/.72 var(--display);letter-spacing:-.14em}.type-monument--edge::before{left:0;bottom:0;width:1600px;height:390px;white-space:nowrap}.type-monument--stack::before{right:70px;top:82px;width:330px;height:680px;white-space:normal;overflow-wrap:anywhere;font-size:300px;line-height:.92;letter-spacing:-.05em}.type-monument--outline::before{left:200px;bottom:0;width:1400px;height:440px;font-size:590px;white-space:nowrap}
:root{--motion-duration:420ms;--motion-ease:cubic-bezier(.16,1,.3,1);--motion-distance:18px;--motion-scale:0.985}

</style></head><body><main class="slide stage motion-root" data-style-id="route-editorial-rail" data-cover-archetype="typography-hero" data-composition-signature="center-edge-span|full-width-type-crop|fused|vertical-drop|q1+q2+q3+q4|self-anchored-type|edge-type-mass" data-title-region="center-edge-span" data-anchor-region="full-width-type-crop" data-overlap="fused" data-dominant-axis="vertical-drop" data-occupied-quadrants="q1+q2+q3+q4" data-anchor-copy-relation="self-anchored-type" data-silhouette="edge-type-mass" data-static-contract="content-visible-without-motion"><div class="type-monument type-monument--outline" data-glyphs="讓策略轉" data-anchor-variant="outline" data-effect-visual-anchor="brand-device-accent" aria-hidden="true"></div><section class="type-copy"><p class="identity">Clickforce · Release Acceptance</p><h1 data-effect-title="hard-cut-field" aria-label="讓策略轉化為可執行的成長路徑"><span class="title-line">讓策略轉化為可執行</span><span class="title-line">的成長路徑</span></h1><p class="subtitle">以一致的品牌語言，讓決策、證據與下一步清楚被看見</p></section></main><script>(()=>{const fit=()=>document.documentElement.style.setProperty('--stage-scale',Math.min(innerWidth/1600,innerHeight/900));addEventListener('resize',fit);fit();})();</script><script>(()=>{const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.classList.add('motion-ready');const roots=[...document.querySelectorAll('.motion-root')];if(reduce||!('IntersectionObserver'in window)){roots.forEach((root)=>root.classList.add('is-visible'));return;}const observer=new IntersectionObserver((entries)=>{for(const entry of entries){if(entry.isIntersecting)entry.target.classList.add('is-visible');}},{threshold:.32});roots.forEach((root)=>observer.observe(root));})();</script></body></html>
