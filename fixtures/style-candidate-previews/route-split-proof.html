<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brand Field</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{position:relative;background:#1736d1;color:#fbf7e9;font-family:'Microsoft JhengHei', 'Microsoft JhengHei UI', 'PingFang TC', sans-serif}.stage{--canvas:#1736d1;--text:#fbf7e9;--muted:#d7dcfa;--accent:#dcff55;--surface:#112797;--display:'Microsoft JhengHei', 'Microsoft JhengHei UI', 'PingFang TC', sans-serif;--body:'Microsoft JhengHei', 'Microsoft JhengHei UI', 'PingFang TC', sans-serif;--mono:Menlo, monospace;position:absolute;left:50%;top:50%;width:1600px;height:900px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--stage-scale,1));background:var(--canvas);color:var(--text);font-family:var(--body);transform-origin:center;border:0px solid var(--muted)}.identity{margin:0;font:800 15px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{margin:30px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.055em}.title-line{display:block;white-space:nowrap;line-height:1.25}.subtitle{margin:34px 0 0;color:var(--muted);font-size:26px;line-height:1.45}
.stage{padding:66px 72px}.brand-field{position:absolute;left:-80px;right:-80px;top:330px;height:650px;background:var(--surface);clip-path:polygon(0 24%,44% 0,100% 14%,100% 100%,0 100%);overflow:hidden}.brand-rhythm{position:absolute;left:560px;right:-80px;top:80px;bottom:28px;display:flex;flex-direction:column;gap:18px;transform:rotate(-7deg)}.brand-rhythm span{display:block;height:48px;width:var(--module);margin-left:var(--shift);background:var(--accent)}.brand-field--falling .brand-rhythm{transform:rotate(7deg);align-items:flex-end}.brand-field--alternating .brand-rhythm span:nth-child(even){margin-left:calc(var(--shift) + 150px);background:var(--canvas)}.brand-copy{position:absolute;left:72px;top:70px;width:1250px;z-index:2}.brand-copy h1{font-size:98px;line-height:.98;margin-top:78px}.brand-copy .subtitle{width:640px;margin-top:42px}.brand-folio{position:absolute;right:72px;bottom:42px;margin:0;font:800 16px/1 var(--mono);letter-spacing:.18em;z-index:3}
:root{--motion-duration:300ms;--motion-ease:ease-out;--motion-distance:26px;--motion-scale:0.97}
html.motion-ready .motion-root [data-effect-title]{opacity:0;clip-path:inset(0 100% 0 0);transform:translateY(var(--motion-distance));transition:opacity var(--motion-duration) var(--motion-ease),clip-path var(--motion-duration) var(--motion-ease),transform var(--motion-duration) var(--motion-ease)}

html.motion-ready .motion-root.is-visible [data-effect-title]{opacity:1;clip-path:inset(0);transform:none}

</style></head><body><main class="slide stage motion-root" data-style-id="route-split-proof" data-cover-archetype="graphic-brand-field" data-composition-signature="upper-left-to-center|lower-full-width-bleed|controlled|field-to-copy|q1+q2+q3+q4|field-enclosure|offstage-brand-field" data-title-region="upper-left-to-center" data-anchor-region="lower-full-width-bleed" data-overlap="controlled" data-dominant-axis="field-to-copy" data-occupied-quadrants="q1+q2+q3+q4" data-anchor-copy-relation="field-enclosure" data-silhouette="offstage-brand-field" data-static-contract="content-visible-without-motion"><div class="brand-field brand-field--falling" data-geometry-family="modular-cadence" data-anchor-variant="falling" data-effect-visual-anchor="brand-device-accent" aria-hidden="true"><div class="brand-rhythm"><span style="--module:74%;--shift:34px"></span><span style="--module:44%;--shift:0px"></span><span style="--module:48%;--shift:102px"></span><span style="--module:58%;--shift:68px"></span><span style="--module:68%;--shift:34px"></span><span style="--module:78%;--shift:0px"></span><span style="--module:48%;--shift:136px"></span></div></div><section class="brand-copy"><p class="identity">PPTSKILL · Dynamic Preview</p><h1 data-effect-title="hard-cut-field" aria-label="讓每個人用 AI 快速完成簡報"><span class="title-line">讓每個人用 AI</span><span class="title-line">快速完成簡報</span></h1><p class="subtitle">從需求釐清、風格選擇到可離線分享的單檔 HTML</p></section><p class="brand-folio">PPTSKILL / COVER</p></main><script>(()=>{const fit=()=>document.documentElement.style.setProperty('--stage-scale',Math.min(innerWidth/1600,innerHeight/900));addEventListener('resize',fit);fit();})();</script><script>(()=>{const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.classList.add('motion-ready');const roots=[...document.querySelectorAll('.motion-root')];if(reduce||!('IntersectionObserver'in window)){roots.forEach((root)=>root.classList.add('is-visible'));return;}const observer=new IntersectionObserver((entries)=>{for(const entry of entries){if(entry.isIntersecting)entry.target.classList.add('is-visible');}},{threshold:.32});roots.forEach((root)=>observer.observe(root));})();</script></body></html>
