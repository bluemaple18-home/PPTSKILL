<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Style · Fixture</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{position:relative;background:#f4f1e8;color:#171917;font-family:Arial, sans-serif}.stage{--canvas:#f4f1e8;--text:#171917;--muted:#60645e;--accent:#d6402c;--surface:#e5e0d4;--display:Arial, sans-serif;--body:Arial, sans-serif;--mono:Menlo, monospace;position:absolute;left:50%;top:50%;width:1600px;height:900px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--stage-scale,1));background:var(--canvas);color:var(--text);font-family:var(--body);transform-origin:center;border:2px solid var(--muted)}.identity{margin:0;font:800 15px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{margin:30px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.055em}.title-line{display:block;white-space:nowrap;line-height:1.25}.subtitle{margin:34px 0 0;color:var(--muted);font-size:26px;line-height:1.45}
.stage{padding:72px 86px}.institutional-rule{position:absolute;left:86px;right:86px;top:72px;height:2px;background:var(--muted)}.institutional-copy{position:absolute;left:86px;bottom:104px;width:770px}.institutional-copy h1{font-size:76px}.quiet-band{position:absolute;right:86px;top:154px;width:500px;height:500px;border:2px solid var(--muted);display:grid;grid-template-columns:2fr 1fr 1fr;align-items:end;padding:34px;gap:16px}.quiet-band span{display:block;background:var(--accent)}.quiet-band span:nth-child(1){height:34%}.quiet-band span:nth-child(2){height:68%}.quiet-band span:nth-child(3){height:100%}.folio{position:absolute;right:86px;bottom:72px;margin:0;font:700 18px/1 var(--mono);letter-spacing:.12em}
:root{--motion-duration:240ms;--motion-ease:ease-out;--motion-distance:12px;--motion-scale:0.992}
html.motion-ready .motion-root [data-effect-title]{opacity:0;clip-path:inset(0 100% 0 0);transform:translateY(var(--motion-distance));transition:opacity var(--motion-duration) var(--motion-ease),clip-path var(--motion-duration) var(--motion-ease),transform var(--motion-duration) var(--motion-ease)}
html.motion-ready .motion-root [data-effect-visual-anchor]{opacity:0;transform:scale(var(--motion-scale));transition:opacity var(--motion-duration) var(--motion-ease),transform var(--motion-duration) var(--motion-ease)}
html.motion-ready .motion-root.is-visible [data-effect-title]{opacity:1;clip-path:inset(0);transform:none}
html.motion-ready .motion-root.is-visible [data-effect-visual-anchor]{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html.motion-ready .motion-root *,html.motion-ready .motion-root *::before,html.motion-ready .motion-root *::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}

</style></head><body><main class="slide stage motion-root" data-style-id="company-style-fixture" data-cover-archetype="minimal-institutional" data-composition-signature="lower-left|upper-right|none|corner-diagonal|q2+q3+q4|detached|quiet-offset-frame" data-title-region="lower-left" data-anchor-region="upper-right" data-overlap="none" data-dominant-axis="corner-diagonal" data-occupied-quadrants="q2+q3+q4" data-anchor-copy-relation="detached" data-silhouette="quiet-offset-frame" data-static-contract="content-visible-without-motion"><div class="institutional-rule" aria-hidden="true"></div><section class="institutional-copy"><p class="identity">PPTSKILL · Dynamic Preview</p><h1 data-effect-title="hard-rule" aria-label="讓每個人用 AI 快速完成簡報"><span class="title-line">讓每個人用 AI</span><span class="title-line">快速完成簡報</span></h1><p class="subtitle">從需求釐清、風格選擇到可離線分享的單檔 HTML</p></section><div class="quiet-band" data-effect-visual-anchor="outlined-surface" aria-hidden="true"><span></span><span></span><span></span></div><p class="folio">01 / 04</p></main><script>(()=>{const fit=()=>document.documentElement.style.setProperty('--stage-scale',Math.min(innerWidth/1600,innerHeight/900));addEventListener('resize',fit);fit();})();</script><script>(()=>{const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.classList.add('motion-ready');const roots=[...document.querySelectorAll('.motion-root')];if(reduce||!('IntersectionObserver'in window)){roots.forEach((root)=>root.classList.add('is-visible'));return;}const observer=new IntersectionObserver((entries)=>{for(const entry of entries){if(entry.isIntersecting)entry.target.classList.add('is-visible');}},{threshold:.32});roots.forEach((root)=>observer.observe(root));})();</script></body></html>
