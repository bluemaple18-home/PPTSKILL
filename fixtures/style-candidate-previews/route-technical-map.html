<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Map</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{position:relative;background:#0c1b19;color:#e8f0e9;font-family:Arial, sans-serif}.stage{--canvas:#0c1b19;--text:#e8f0e9;--muted:#9ab0a7;--accent:#a9ffcb;--surface:#122824;--display:Arial, sans-serif;--body:Arial, sans-serif;--mono:Menlo, monospace;position:absolute;left:50%;top:50%;width:1600px;height:900px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--stage-scale,1));background:var(--canvas);color:var(--text);font-family:var(--body);transform-origin:center;border:1px solid var(--muted)}.identity{margin:0;font:800 15px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{margin:30px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.055em}.title-line{display:block;white-space:nowrap;line-height:1.25}.subtitle{margin:34px 0 0;color:var(--muted);font-size:26px;line-height:1.45}

</style></head><body><main class="slide stage motion-root" data-style-id="route-technical-map" data-cover-archetype="information-led-cover" data-static-contract="content-visible-without-motion"><section class="information-copy"><p class="identity">PPTSKILL · Dynamic Preview</p><h1 data-effect-title="hard-rule" aria-label="讓每個人用 AI 快速完成簡報"><span class="title-line">讓每個人用 AI</span><span class="title-line">快速完成簡報</span></h1><p class="subtitle">從需求釐清、風格選擇到可離線分享的單檔 HTML</p></section><div class="information-network" data-effect-visual-anchor="outlined-surface" aria-hidden="true"><i class="network-line line-a"></i><i class="network-line line-b"></i><i class="network-line line-c"></i><span class="node node-a"></span><span class="node node-b"></span><span class="node node-c"></span><span class="node node-d"></span><b>01</b></div></main><script>(()=>{const fit=()=>document.documentElement.style.setProperty('--stage-scale',Math.min(innerWidth/1600,innerHeight/900));addEventListener('resize',fit);fit();})();</script><script>(()=>{const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.classList.add('motion-ready');const roots=[...document.querySelectorAll('.motion-root')];if(reduce||!('IntersectionObserver'in window)){roots.forEach((root)=>root.classList.add('is-visible'));return;}const observer=new IntersectionObserver((entries)=>{for(const entry of entries){if(entry.isIntersecting)entry.target.classList.add('is-visible');}},{threshold:.32});roots.forEach((root)=>observer.observe(root));})();</script></body></html>
