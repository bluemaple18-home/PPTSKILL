            ['blurFactor','n',0.6,[0.1,0.9,0.05]],['speed','n',1,[0,5,0.1]],['zoom','n',1,[0.1,3,0.1]]]},
  clouds:  {lib:'three', o:[['backgroundColor','c',0xffffff],['skyColor','c',0x68b8d7],
            ['cloudColor','c',0xadc1de],['cloudShadowColor','c',0x183550],['sunColor','c',0xff9919],
            ['sunGlareColor','c',0xff6633],['sunlightColor','c',0xff9933],['speed','n',1,[0,5,0.1]]]},
  clouds2: {lib:'three', o:[['backgroundColor','c',0x000000],['skyColor','c',0x5ca6ca],
            ['cloudColor','c',0x334d80],['lightColor','c',0xffffff],['speed','n',1,[0,5,0.1]]]},
  cells:   {lib:'three', o:[['color1','c',0x008c8c],['color2','c',0xf2e735],['backgroundColor','c',0xd7ff8f],
            ['size','n',1.5,[0.5,3,0.1]],['speed','n',1,[0,5,0.1]]]},
  ripple:  {lib:'three', o:[['color1','c',0x060b25],['color2','c',0xffffff],['backgroundColor','c',0xf6f6f6],
            ['amplitudeFactor','n',1,[0,3,0.1]],['ringFactor','n',4,[0,10,0.5]],
            ['rotationFactor','n',0.1,[0,2,0.05]],['speed','n',1,[0,5,0.1]]]},
  rings:   {lib:'three', o:[['color','c',0x88ff00],['backgroundColor','c',0x202428]]},
  halo:    {lib:'three', o:[['baseColor','c',0x001a59],['backgroundColor','c',0x131a43],
            ['amplitudeFactor','n',1,[0,3,0.1]],['size','n',1,[0.5,2,0.05]],
            ['xOffset','n',0,[-1,1,0.05]],['yOffset','n',0,[-1,1,0.05]]]},
  topology:{lib:'p5',    o:[['color','c',0x89964e],['backgroundColor','c',0x002222]]},
  trunk:   {lib:'p5',    o:[['color','c',0x98465f],['backgroundColor','c',0x222426],
            ['spacing','n',0,[0,10,0.5]],['chaos','n',1,[0,10,0.5]]]},
};
// 每個效果「底色」是哪一個參數，以及沿用投影片底色時要先乘上的係數。
// WAVES 沒有 backgroundColor —— 它整面就是那張波浪網格，所以底色要接到 color；
// 而且 Vanta 的打光會把顏色提亮，直接餵紙色會變成一片死白，實測乘 0.85 最接近。
// 其餘效果的 backgroundColor 是真正的底，不需要補償。
// 每個效果的「底色」對應到哪些參數，以及各自要乘的係數。是陣列不是單一鍵：
// CLOUDS 的天空是 skyColor（backgroundColor 在它身上看不出效果），WAVES 沒有底色
// 參數、整面就是那張網格所以接 color，FOG 則是 baseColor。
const VANTA_INHERIT = {
  waves:    [['color', 0.85]],            // 打光會提亮，先壓暗才接近紙色
  fog:      [['baseColor', 1]],
  clouds:   [['skyColor', 1], ['backgroundColor', 1]],
  clouds2:  [['skyColor', 1], ['backgroundColor', 1]],
  birds:    [['backgroundColor', 1]], net:      [['backgroundColor', 1]],
  globe:    [['backgroundColor', 1]], dots:     [['backgroundColor', 1]],
  // CELLS 的 backgroundColor 完全看不到（實測與預設逐格相同）；看得到的是
  // color1 / color2 兩色漸變。兩個都接底色，第二個壓暗才有細胞輪廓的對比。
  cells:    [['color1', 1], ['color2', 0.80], ['backgroundColor', 1]],
  ripple:   [['backgroundColor', 1]],
  rings:    [['backgroundColor', 1]], halo:     [['backgroundColor', 1]],
  topology: [['backgroundColor', 1]], trunk:    [['backgroundColor', 1]],
};
const inheritKeys = eff => (VANTA_INHERIT[eff] || []).map(r => r[0]);
function inheritBg(eff, opts){
  const rules = VANTA_INHERIT[eff], bg = slideBgHex();
  if(!rules || bg === null) return false;
  let hit = false;
  rules.forEach(([key, f])=>{
    if(!(key in opts)) return;
    opts[key] = (Math.round(((bg>>16)&255)*f)<<16)
              + (Math.round(((bg>>8)&255)*f)<<8)
              +  Math.round((bg&255)*f);
    hit = true;
  });
  return hit;
}
const VANTA_NAMES = Object.keys(VANTA_SCHEMA);


// Vanta 的設定就存在圖層元素的 data-vanta 屬性裡，跟 data-ed 同樣的做法：
// 投影片 HTML 是唯一真相，重新開啟時面板直接從那裡讀回來。
const VANTA_LAYER = '.vanta-layer';
const hex = n => '#' + (n>>>0 & 0xffffff).toString(16).padStart(6,'0');
const unhex = h => parseInt(h.replace('#',''), 16);

function vantaEl(){ return doc() && doc().querySelector(VANTA_LAYER); }

// 開啟效果時，backgroundColor 預設沿用這張投影片自己的底色。
// 不這樣做的話，NET 的預設深紫會直接蓋掉 theme 的紙色，文字變成深色壓深色 ——
// 「加一個背景動畫」不該把整張投影片的配色換掉。
function slideBgHex(){
  const d = doc(); if(!d) return null;
  for(const el of [d.body, d.documentElement]){
    const c = d.defaultView.getComputedStyle(el).backgroundColor;
    const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(c || '');
    if(m && (m[4] === undefined || parseFloat(m[4]) > 0.01))
      return (+m[1] << 16) + (+m[2] << 8) + (+m[3]);
  }
  return null;
}
function vantaCfg(){
  const el = vantaEl(); if(!el) return null;
  try{ return JSON.parse(el.dataset.vanta); }catch(e){ return null; }
}

// 背景層壓在所有內容之下；前景層蓋在最上面，並且一定要 pointer-events:none，
// 否則整張投影片都點不到。前景還會強制 backgroundAlpha:0 —— 效果自己的底色
// 不透明的話，蓋上去就等於把整頁塗掉了。
function vantaLayerCss(layer){
  return layer === 'fg'
    ? 'position:absolute;inset:0;z-index:80;pointer-events:none;'
    : 'position:absolute;inset:0;z-index:0;';
}

function vantaInitCode(cfg){
  const opts = Object.entries(cfg.opts).map(([k,v])=>
    typeof v === 'string' ? `${k}: ${JSON.stringify(v)}`
    : typeof v === 'boolean' ? `${k}: ${v}`
    : (/olor|Color$/.test(k) ? `${k}: 0x${(v>>>0 & 0xffffff).toString(16).padStart(6,'0')}` : `${k}: ${v}`)
  );
  if(cfg.layer === 'fg') opts.push('backgroundAlpha: 0');
  if(cfg.effect === 'clouds2') opts.push('texturePath: "lib/noise.png"');
  return `VANTA.${cfg.effect.toUpperCase()}({ el: ".vanta-layer", mouseControls: true,\n`
       + `  touchControls: true, gyroControls: false, minHeight: 200, minWidth: 200,\n`
       + `  scale: 1, scaleMobile: 1,\n  ${opts.join(', ')} });`;
}

// 重建這一頁的 Vanta：先清乾淨舊的圖層與 script，再照設定重新插入。
// 之所以整組重來而不是就地改，是因為切換效果會換掉要載入的檔案。
async function vantaApply(cfg){
  const d = doc(); if(!d) return;
  pushUndo();
  // 先清除
  try{ if(d.defaultView.__vanta && d.defaultView.__vanta.destroy) d.defaultView.__vanta.destroy(); }catch(e){}
  d.querySelectorAll(VANTA_LAYER + ',[data-vanta-src],[data-vanta-junk]').forEach(e=>e.remove());
  if(!cfg || !cfg.effect){ persist(); syncVanta(); return; }

  const r = await post('/api/vanta', {effect: cfg.effect});
  if(!r.ok) return;

  const layer = d.createElement('div');
  layer.className = 'vanta-layer';
  layer.setAttribute('data-live','');            // 執行期的 canvas 不進檔案
  layer.setAttribute('data-live-id','vanta');   // 穩定索引鍵，重開才對得回來
  layer.dataset.vanta = JSON.stringify(cfg);
  layer.style.cssText = vantaLayerCss(cfg.layer);
  d.body.insertBefore(layer, cfg.layer === 'fg' ? null : d.body.firstChild);

  const known = new Set([...d.body.children]);
  const mk = (src, code) => {
    const t = d.createElement('script');
    t.setAttribute('data-vanta-src','');
    if(src) t.src = src; else t.textContent = code;
    d.body.appendChild(t);
    return t;
  };
  // 依序載入：函式庫 → 效果檔 → 初始化。用 onload 串接，不能一次全丟。
  await new Promise(res=>{ const t = mk('lib/' + r.base); t.onload = res; t.onerror = res; });
  await new Promise(res=>{ const t = mk('lib/' + r.effectFile); t.onload = res; t.onerror = res; });
  mk(null, 'window.__vanta = ' + vantaInitCode(cfg));
  // p5.js 會自己在 body 上掛一個 <main>（TOPOLOGY / TRUNK 用 p5）。那東西在
  // data-live 容器外面，不標記的話會被序列化寫進原始檔，而且每試一次就多一個。
  // 這裡不猜是哪個標籤，直接比對「啟動後多出來的 body 直接子元素」。
  await new Promise(r=>setTimeout(r, 300));
  [...d.body.children].forEach(e=>{
    if(known.has(e) || e.classList.contains('vanta-layer')
       || e.hasAttribute('data-vanta-src')) return;
    e.setAttribute('data-vanta-junk','');
  });
  persist(); syncVanta();
  msg(r.downloaded.length ? `已下載 ${r.downloaded.join('、')}` : `已套用 ${cfg.effect.toUpperCase()}`, 'ok');
}

function syncVanta(){
  const cfg = vantaCfg();
  const eff = cfg ? cfg.effect : '';
  $('#vEffect').value = eff;
  $('#vLayerRow').style.display = eff ? 'flex' : 'none';
  document.querySelectorAll('[data-vlayer]').forEach(b=>
    b.classList.toggle('on', cfg && cfg.layer === b.dataset.vlayer));
  const box = $('#vOpts');
  if(!eff){ box.innerHTML = ''; return; }
  const sch = VANTA_SCHEMA[eff];
  box.innerHTML = sch.o.map(([k,type,def,extra])=>{
    const v = cfg.opts[k] !== undefined ? cfg.opts[k] : def;
    // 前景模式下底色沒有作用（backgroundAlpha 被設成 0），直接不顯示以免誤導
    // 前景模式下底色參數沒有作用（backgroundAlpha 被設成 0），藏起來以免誤導。
    // WAVES 的 color 例外 —— 那是波浪本身的顏色，不是底。
    if(cfg.layer === 'fg' && k !== 'color'
       && (k === 'backgroundColor' || inheritKeys(eff).includes(k))) return '';
    if(type === 'c') return `<div class="vrow"><label>${k}</label>`
      + `<input type="color" data-vk="${k}" value="${hex(v)}"></div>`;
    if(type === 'b') return `<div class="vrow"><label>${k}</label>`
      + `<input type="checkbox" data-vk="${k}" ${v?'checked':''}></div>`;
    if(type === 's') return `<div class="vrow"><label>${k}</label><select data-vk="${k}">`
      + extra.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('') + '</select></div>';
    const [mn,mx,st] = extra;
    return `<div class="vrow"><label>${k}</label>`
      + `<input type="range" data-vk="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}">`
      + `<span class="vnum">${v}</span></div>`;
  }).join('');
  box.querySelectorAll('[data-vk]').forEach(inp=>{
    const commit = ()=>{
      const c = vantaCfg(); if(!c) return;
      c.opts[inp.dataset.vk] = inp.type==='checkbox' ? inp.checked
        : inp.type==='color' ? unhex(inp.value)
        : inp.type==='range' ? parseFloat(inp.value) : inp.value;
      vantaApply(c);
    };
    // 拖 slider 時只更新數字，放開才重建 —— 每動一格就重建效果會卡死
    if(inp.type === 'range'){
      inp.oninput = ()=>{ inp.nextElementSibling.textContent = inp.value; };
      inp.onchange = commit;
    } else inp.onchange = commit;
  });
}

$('#vEffect').onchange = ()=>{
  const eff = $('#vEffect').value;
  if(!eff) return vantaApply(null);
  const old = vantaCfg();
  const sch = VANTA_SCHEMA[eff];
  const opts = {};
  sch.o.forEach(([k,,def])=>{ opts[k] = def; });
  inheritBg(eff, opts);
  vantaApply({effect: eff, layer: (old && old.layer) || 'bg', opts});
};
$('#vInherit').onclick = ()=>{
  const c = vantaCfg(); if(!c) return;
  if(inheritBg(c.effect, c.opts)) vantaApply(c);
  else msg('這個效果沒有可以沿用底色的參數','err');
};
document.querySelectorAll('[data-vlayer]').forEach(b=> b.onclick = ()=>{
  const c = vantaCfg(); if(!c) return;
  c.layer = b.dataset.vlayer;
  vantaApply(c);
});

// --------------------------------------------------------------- 文字樣式
// **字體只提供 theme 的三個「角色」，不提供字體名稱。**
// build_deck.py 打包時是改寫 --display-font / --body-font / --label-font 這三個
// 變數（把 CJK 換成內嵌的子集字體），它不會去動元素上的 font-family。所以如果
// 這裡寫死一個字體名稱，那段字在你機器上看起來對，匯出後在別台機器就會掉字。
// 用 var(--…) 就永遠跟著 deck 內嵌的字體走。
const ROLES = ['--display-font','--body-font','--label-font'];
function themeVars(){
  const d = doc(); const out = new Map();
  if(!d) return out;
  for(const sheet of d.styleSheets){
    let rules; try{ rules = sheet.cssRules; }catch(e){ continue; }
    for(const r of rules){
      if(!r.selectorText || !/:root/.test(r.selectorText)) continue;
      for(const name of r.style){
        if(!name.startsWith('--')) continue;
        out.set(name, r.style.getPropertyValue(name).trim());
      }
    }
  }
  return out;
}
function syncType(){
  const p = primary(); if(!p) return;
  const cs = frame.contentWindow.getComputedStyle(p.el);
  $('#ffs').value = Math.round(parseFloat(cs.fontSize)) || '';
  const lh = parseFloat(cs.lineHeight);
  $('#flh').value = lh ? +(lh / (parseFloat(cs.fontSize)||1)).toFixed(2) : '';
  const inline = p.el.style.fontFamily || '';
  document.querySelectorAll('[data-role]').forEach(b=>
    b.classList.toggle('on', inline.includes(b.dataset.role)));
  // 這一頁若沒有 theme 的字體變數，按下去會寫入一個解不開的 var()，畫面毫無
  // 反應。原本是靜靜地什麼都沒發生，看起來像壞掉；現在停用並講原因。
  // 逐一檢查而不是「有沒有任何一個」：deck 可能只定義了其中一兩個角色。
  const rootCs = frame.contentWindow.getComputedStyle(doc().documentElement);
  const missing = [];
  document.querySelectorAll('[data-role]').forEach(b=>{
    const ok = !!rootCs.getPropertyValue(b.dataset.role).trim();
    b.disabled = !ok;
    b.title = ok ? '' : `這一頁沒有定義 ${b.dataset.role}`;
    if(!ok) missing.push(b.dataset.role);
  });
  $('#roleNote').textContent = !missing.length ? ''
    : missing.length === ROLES.length
      ? '這一頁沒有 theme 字體變數，字體角色無法套用'
      : `這一頁缺少 ${missing.join('、')}`;
  // 色票直接從這份 deck 的 :root 變數來，改色就不會跑出設計系統之外
  const vars = themeVars();
  $('#sw').innerHTML = [...vars.entries()]
    .filter(([,v]) => /^(#|rgb|hsl)/i.test(v))
    .map(([k,v]) => `<button class="sw" data-var="${k}" title="${k}" style="background:${v}"></button>`)
    .join('');
  $('#sw').querySelectorAll('.sw').forEach(b=>
    b.onclick = ()=> applyStyle('color', `var(${b.dataset.var})`));
}
// ------------------------------------------------------- 複製 / 貼上文字樣式
// 只搬「看得到的文字外觀」，不碰位置與尺寸 —— 那是 data-ed 那一層的事。
const STYLE_PROPS = ['font-family','font-size','font-weight','font-style','line-height',
  'letter-spacing','word-spacing','color','text-transform','text-align',
  'text-decoration-line','font-variant-numeric'];
let styleClip = null;

const normFam = v => (v||'').replace(/["']/g,'').replace(/\s*,\s*/g,',').trim().toLowerCase();

// 把解析後的字體堆疊換回 theme 的角色變數。**這一步不能省**：computed 的
// font-family 是展開後的字體名稱，而 build_deck.py 打包時只改寫
// --display-font / --body-font / --label-font 這三個變數，不會動元素上的
// font-family。寫死名稱的話，這段字在你機器上對、換一台就掉字。
function familyAsRole(resolved){
  const d = doc(); if(!d) return null;
  const rootCs = d.defaultView.getComputedStyle(d.documentElement);
  for(const r of ROLES){
    const v = rootCs.getPropertyValue(r);
    if(v && normFam(v) === normFam(resolved)) return r;
  }
  return null;
}

function copyStyle(){
  const p = primary(); if(!p){ msg('先選一個元素','err'); return; }
  const cs = frame.contentWindow.getComputedStyle(p.el);
  const out = {};
  STYLE_PROPS.forEach(k=>{
    const v = cs.getPropertyValue(k);
    if(v && v !== 'normal' && v !== 'none' && v !== 'auto') out[k] = v;
  });
  const role = familyAsRole(cs.fontFamily);
  if(role) out['font-family'] = `var(${role})`;
  styleClip = out;
  $('#btnPasteStyle').disabled = false;
  const roleName = role ? ({'--display-font':'標題字','--body-font':'內文字','--label-font':'標籤字'})[role] : '自訂字體';
  $('#clipInfo').textContent = `${roleName} · ${out['font-size']||''} · `
    + `${out['font-style']==='italic'?'斜體 · ':''}${out['font-weight']||''}`;
  msg('已複製文字樣式','ok');
}

function pasteStyle(){
  if(!styleClip){ msg('還沒有複製任何樣式','err'); return; }
  if(!sels.length){ msg('先選一個元素','err'); return; }
  pushUndo();
  sels.forEach(s=> Object.entries(styleClip).forEach(([k,v])=> s.el.style.setProperty(k,v)));
  drawBox(); persist(); syncType();
  msg(`已套用到 ${sels.length} 個元素`,'ok');
}
$('#btnCopyStyle').onclick = copyStyle;
$('#btnPasteStyle').onclick = pasteStyle;

function applyStyle(prop, val, token){
  if(!sels.length) return;
  pushUndo(token);
  sels.forEach(s=>{
    if(val === '') s.el.style.removeProperty(prop);
    else s.el.style.setProperty(prop, val);
    if(!s.el.getAttribute('style')) s.el.removeAttribute('style');
  });
  drawBox(); persist();
}
document.querySelectorAll('[data-role]').forEach(b=> b.onclick = ()=>{
  const on = b.classList.contains('on');
  applyStyle('font-family', on ? '' : `var(${b.dataset.role})`);
  syncType();
});
$('#ffs').addEventListener('change', ()=>{
  const v = parseFloat($('#ffs').value);
  applyStyle('font-size', v ? v+'px' : '', 'fsize'); syncType();
});
$('#flh').addEventListener('change', ()=>{
  const v = parseFloat($('#flh').value);
  applyStyle('line-height', v ? String(v) : '', 'flh'); syncType();
});

// 插入文字框：跟圖片一樣是 .ovr-ins，但預設吃 theme 的內文字，才不會像外來物
$('#btnText').onclick = ()=>{
  const d = doc(); if(!d) return;
  pushUndo();
  const m = {kind:'insert', type:'text', x:420, y:300, w:440, h:90, rot:0, z:60};
  const el = d.createElement('div');
  el.className = 'ovr-ins';
  el.style.cssText = `position:absolute;left:${m.x}px;top:${m.y}px;width:${m.w}px;`
    + `height:${m.h}px;transform:rotate(0deg);transform-origin:center center;`
    + `z-index:${m.z};font-family:var(--body-font);font-size:24px;line-height:1.6;`;
  el.textContent = '雙擊編輯文字';
  el.dataset.ed = JSON.stringify(m);
  d.body.appendChild(el);
  select(el, false); persist(); msg('已插入文字框，雙擊即可編輯','ok');
};

// ------------------------------------------------------------- 檔案挑選器
async function browse(path){
  const r = await fetch('/api/browse' + (path ? '?path='+encodeURIComponent(path) : ''));
  const j = await r.json();
  $('#pkPath').textContent = j.path;
  const rows = [];
  if(j.parent) rows.push(`<div class="pkrow" data-go="${j.parent}"><span class="n">‹ 上一層</span></div>`);
  j.entries.forEach(e=> rows.push(
    `<div class="pkrow ${e.isDeck?'deck':''}" data-go="${e.path}" data-deck="${e.isDeck?1:0}">`
    + `<span class="n">${e.name}</span>`
    + `<span class="c">${e.slides ? e.slides+' 頁' : ''}</span></div>`));
  $('#pkList').innerHTML = rows.join('') || '<div class="pkrow"><span class="n">（空的）</span></div>';
  $('#pkList').querySelectorAll('[data-go]').forEach(d=> d.onclick = async ()=>{
    if(d.dataset.deck === '1'){
      const j2 = await post('/api/open', {path: d.dataset.go});
      if(!j2.ok) return;
      S.slides = j2.slides; S.edited = j2.edited; S.stamp = j2.stamp; S.slide = null;
      S.deckPath = j2.deckPath;          // 下次開挑選器要從新的 deck 開始瀏覽
      Object.keys(undoStacks).forEach(k=>delete undoStacks[k]);
      Object.keys(redoStacks).forEach(k=>delete redoStacks[k]);
      dropHistory(null);                 // 換 deck，舊 deck 的歷史留著沒有意義
      $('#picker').classList.remove('on');
      renderList(); if(S.slides.length) open(S.slides[0]);
      setSaveState('saved'); msg(`已開啟 ${j2.deck}`,'ok');
    }else browse(d.dataset.go);
  });
}
$('#btnOpen').onclick = ()=>{ $('#picker').classList.add('on'); browse(S.deckPath || ''); };
$('#pkCancel').onclick = ()=> $('#picker').classList.remove('on');
$('#picker').onclick = ev=>{ if(ev.target === $('#picker')) $('#picker').classList.remove('on'); };


// --------------------------------------------------------------- 文字動畫
// 設定寫在元素的 data-anim（JSON），跟 Vanta 的 data-vanta 同一套做法：投影片
// HTML 是唯一真相來源，面板重開時直接讀回來，不另外存一份側車。
//
// 執行期腳本是「第一次用到才注入這一頁」，跟 /api/vanta 下載效果檔同樣的
// 用到才拿的模式。必須內嵌（不能外連），打包後才離線可用。
const ANIM_EASES = {
  expo:  't>=1?1:1-Math.pow(2,-10*t)',
  quart: '1-Math.pow(1-t,4)',
  cubic: '1-Math.pow(1-t,3)',
};
const ANIM_EASE_FN = {
  expo:  t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  quart: t => 1 - Math.pow(1 - t, 4),
  cubic: t => 1 - Math.pow(1 - t, 3),
};
const ANIM_DEFAULT = { effect: 'count', ease: 'expo', dur: 1400,
                       dir: 'right', stagger: 120, order: 1 };

// 注入到投影片裡的執行期。三件事非做不可，改之前先讀 CLAUDE.md 的說明：
//  1. 編輯 iframe（frameElement.id === 'frame'）裡完全不跑 —— 存檔是序列化整份
//     live DOM，數到一半存檔就把「3×」永久寫進原始檔。
//  2. 歸零只在第一個 frame 真的跑起來之後做，另外掛 setTimeout 保險強制收尾。
//     requestAnimationFrame 在背景分頁不會跑，少了這道保險，數字會停在 0。
//  3. 捲離畫面就 reset，翻回這一頁才會重播。
const ANIM_RUNTIME = `(function(){
  var fe=null; try{fe=window.frameElement;}catch(e){}
  if(fe && fe.id==='frame') return;
  var E={${Object.entries(ANIM_EASES).map(([k,v])=>`${k}:function(t){return ${v};}`).join(',')}};
  [].forEach.call(document.querySelectorAll('[data-anim]'),function(el){
    var cfg; try{cfg=JSON.parse(el.getAttribute('data-anim'));}catch(e){return;}
    if(!cfg||cfg.effect!=='count') return;
    var raw=el.textContent, m=raw.match(/^(\\D*?)([\\d,]+(?:\\.\\d+)?)(.*)$/);
    if(!m) return;
    var n=parseFloat(m[2].replace(/,/g,'')); if(!isFinite(n)) return;
    var dot=m[2].indexOf('.'), dp=dot<0?0:m[2].length-dot-1;
    var pre=m[1], suf=m[3], DUR=cfg.dur||1400, ease=E[cfg.ease]||E.expo;
    var t0=null,guard=null,done=false,started=false;
    function restore(){ el.textContent=raw; }
    function finish(){ if(done)return; done=true; clearTimeout(guard); restore(); }
    function frame(ts){
      if(done) return;
      if(t0===null){ t0=ts; el.textContent=pre+(0).toFixed(dp)+suf; }
      var t=Math.min(1,(ts-t0)/DUR);
      if(t>=1) return finish();
      el.textContent=pre+(n*ease(t)).toFixed(dp)+suf;
      requestAnimationFrame(frame);
    }
    function start(){ if(started||done)return; started=true;
      requestAnimationFrame(frame); guard=setTimeout(finish,DUR+1200); }
    function reset(){ clearTimeout(guard); started=false; done=false; t0=null; restore(); }
    var PIO=null; try{ if(fe&&window.parent!==window) PIO=window.parent.IntersectionObserver; }catch(e){}
    if(PIO && fe.className.indexOf('slide-frame')>=0){
      new PIO(function(es){ for(var i=0;i<es.length;i++) es[i].isIntersecting?start():reset(); },
              {threshold:0.4}).observe(fe);
    } else start();
  });

  // ---- 進場滑入 ----
  var revs=[];
  [].forEach.call(document.querySelectorAll('[data-anim]'),function(el){
    var cfg; try{cfg=JSON.parse(el.getAttribute('data-anim'));}catch(e){return;}
    if(!cfg||cfg.effect!=='reveal') return;
    revs.push({el:el,cfg:cfg,ord:+cfg.order||0});
  });
  if(revs.length){
    revs.sort(function(a,b){ return a.ord-b.ord; });
    var OFF={right:'translateX(%dpx)',left:'translateX(-%dpx)',
             up:'translateY(-%dpx)',down:'translateY(%dpx)'};
    var CB={expo:'cubic-bezier(.16,1,.3,1)',quart:'cubic-bezier(.25,1,.5,1)',
            cubic:'cubic-bezier(.33,1,.68,1)'};
    // **一定要疊在既有 transform 之上，不能覆蓋。** 主題自己會用 transform 定位
    // （translateY(-50%) 之類），而 data-ed 的位移也寫在同一個屬性上；直接指派
    // 會把元素挪到別的地方去。所以先記下原本的 inline 值，結束時原樣寫回。
    revs.forEach(function(r){
      r.tf0=r.el.style.transform||''; r.op0=r.el.style.opacity||'';
    });
    var rDone=false,rGuard=null,rStarted=false;
    function rShow(){                       // 一律回到「看得見而且位置正確」
      if(rDone) return; rDone=true; clearTimeout(rGuard);
      revs.forEach(function(r){
        r.el.style.transition='';
        r.el.style.transform=r.tf0; r.el.style.opacity=r.op0;
        if(!r.tf0) r.el.style.removeProperty('transform');
        if(!r.op0) r.el.style.removeProperty('opacity');
      });
    }
    function rHide(){
      revs.forEach(function(r){
        var d=r.cfg.dist||28;
        r.el.style.transition='none';
        r.el.style.opacity='0';
        r.el.style.transform=(r.tf0?r.tf0+' ':'')+
          (OFF[r.cfg.dir]||OFF.right).replace('%d',d);
      });
    }
    function rStart(){
      if(rStarted||rDone) return; rStarted=true; clearTimeout(rGuard);
      var stag=revs[0].cfg.stagger==null?120:+revs[0].cfg.stagger;
      var dur=revs[0].cfg.dur||600, cb=CB[revs[0].cfg.ease]||CB.expo;
      revs.forEach(function(r,i){
        setTimeout(function(){
          if(rDone) return;
          r.el.style.transition='transform '+dur+'ms '+cb+', opacity '+dur+'ms '+cb;
          r.el.style.transform=r.tf0; r.el.style.opacity=r.op0||'1';
        }, i*stag+16);
      });
      // 同一道保險：轉場在背景分頁不一定跑得完，文字絕對不能留在隱形狀態
      rGuard=setTimeout(rShow, revs.length*stag+dur+1200);
    }
    function rReset(){ clearTimeout(rGuard); rStarted=false; rDone=false; rHide(); }
    rHide();
    // **保險必須在「隱藏」的當下就上，不能等 rStart。** 數字滾動可以等，因為它
    // 不先動文字；進場滑入一定要先藏起來，否則會閃一下。但 IntersectionObserver
    // 在背景分頁完全不會觸發（跟 rAF 一樣），所以 rStart 可能永遠不會被呼叫 ——
    // 實測就是這樣：8 個項目全部停在 opacity:0，整頁文字消失。沒人來啟動就自己現形。
    rGuard=setTimeout(rShow,3000);
    var PIO2=null; try{ if(fe&&window.parent!==window) PIO2=window.parent.IntersectionObserver; }catch(e){}
    if(PIO2 && fe.className.indexOf('slide-frame')>=0){
      new PIO2(function(es){ for(var i=0;i<es.length;i++) es[i].isIntersecting?rStart():rReset(); },
               {threshold:0.4}).observe(fe);
    } else rStart();
  }
})();`;

function animCfg(el){
  try{ return JSON.parse(el.dataset.anim); }catch(e){ return null; }
}

// 這一頁還有沒有人在用動畫？沒有就把執行期一起收掉，別留在檔案裡。
function syncAnimRuntime(){
  const d = doc(); if(!d) return;
  const used = d.querySelectorAll('[data-anim]').length;
  const tag = d.querySelector('script[data-anim-runtime]');
  if(used && !tag){
    // 用 createElement 而不是寫字串，這樣 editor.html 裡就不會出現一個
    // 會把自己這個 script 提前結束掉的結束標籤
    const s = d.createElement('script');
    s.setAttribute('data-anim-runtime','');
    s.textContent = ANIM_RUNTIME;
    d.body.appendChild(s);
  }else if(!used && tag){
    tag.remove();
  }
}

function applyAnim(){
  if(!sels.length) return;
  const effect = $('#aEffect').value;
  pushUndo();
  sels.forEach((s, i)=>{
    if(!effect) s.el.removeAttribute('data-anim');
    else if(effect === 'reveal'){
      // 多選＝你正在「定義這一組的順序」，所以一律照點選先後重編 1..N，
      // 不要沿用面板上的數字。面板顯示的是 primary() 的值，而 primary() 是
      // **最後**選到的那一個 —— 拿它當起點，重套一次就會把 1..8 變成 8..15。
      // 單選才用面板的值，那是「把這一個插到第幾個」的用法。
      const order = sels.length > 1 ? i + 1 : (+$('#aOrder').value || 1);
      s.el.dataset.anim = JSON.stringify({
        effect, dir: $('#aDir').value, order,
        stagger: +$('#aStagger').value, ease: $('#aEase').value,
        dur: +$('#aDur').value });
    }
    else s.el.dataset.anim = JSON.stringify({
      effect, ease: $('#aEase').value, dur: +$('#aDur').value });
  });
  syncAnimRuntime();
  persist(); syncAnim();
}

// 面板內預覽。刻意不在投影片上跑：那會改 textContent，正是存檔會寫進檔案的東西。
let aPrevTimer = null;
function animPreview(){
  clearTimeout(aPrevTimer);
  const p = primary();
  const raw = p ? p.el.textContent.trim() : '';
  const m = raw.match(/^(\D*?)([\d,]+(?:\.\d+)?)(.*)$/);
  const src = m ? raw : '7×';
  const mm = m || src.match(/^(\D*?)([\d,]+(?:\.\d+)?)(.*)$/);
  const to = parseFloat(mm[2].replace(/,/g,''));
  const dot = mm[2].indexOf('.'), dp = dot<0?0:mm[2].length-dot-1;
  const dur = +$('#aDur').value, ease = ANIM_EASE_FN[$('#aEase').value] || ANIM_EASE_FN.expo;
  const out = $('#aPrev'), t0 = performance.now();
  (function step(){
    const t = Math.min(1, (performance.now()-t0)/dur);
    out.textContent = t>=1 ? src : mm[1] + (to*ease(t)).toFixed(dp) + mm[3];
    if(t<1) aPrevTimer = setTimeout(step, 16);
  })();
}

function syncAnim(){
  const p = primary(); if(!p) return;
  const cfg = animCfg(p.el) || {};
  const isRev = cfg.effect === 'reveal';
  $('#aEffect').value = cfg.effect || '';
  $('#aEase').value   = cfg.ease || ANIM_DEFAULT.ease;
  $('#aDur').value    = cfg.dur  || (isRev ? 600 : ANIM_DEFAULT.dur);
  $('#aDurN').textContent = $('#aDur').value;
  $('#aDir').value    = cfg.dir || ANIM_DEFAULT.dir;
  $('#aOrder').value  = cfg.order || nextAnimOrder();
  $('#aStagger').value = cfg.stagger == null ? ANIM_DEFAULT.stagger : cfg.stagger;
  $('#aStagN').textContent = $('#aStagger').value;
  $('#aOrderN').textContent = '/ ' + revealCount();
  document.querySelectorAll('.arev').forEach(r=> r.style.display = isRev ? 'flex' : 'none');
  $('#aOpts').classList.toggle('on', !!cfg.effect);
  // 沒有數字就沒有東西可以滾。與其讓人設定完發現沒反應，先講清楚。
  // 「沒有數字」只擋數字滾動；進場滑入任何文字都能套
  const hasNum = /[\d]/.test(p.el.textContent || '');
  $('#aEffect').querySelector('[value=count]').disabled = !hasNum;
  $('#aEffect').disabled = false;
  $('#aNote').textContent = (!hasNum && cfg.effect === 'count')
    ? '這個元素裡沒有數字，數字滾動沒有東西可以套用。'
    : (cfg.effect ? '編輯時不播放，按「播放」看效果' : '');
  // 完整理由放 title，面板上只留一行 —— 這段說明會一直掛在那，三行灰字太吵
  $('#aNote').title = cfg.effect
    ? '動畫會改文字內容，而存檔是序列化整份 live DOM。在編輯中的投影片上播放，'
      + '數到一半存檔就會把「3×」永久寫進檔案。' : '';
  if(cfg.effect === 'count') animPreview(); else $('#aPrev').textContent = '—';
  $('#aPlay').disabled = cfg.effect !== 'count';
  drawAnimOrder();
}

// 這一頁已經有幾個進場元素；新加的預設排在最後
function revealEls(){
  const d = doc(); if(!d) return [];
  return [...d.querySelectorAll('[data-anim]')]
    .map(el=>({el, cfg: animCfg(el) || {}}))
    .filter(x=> x.cfg.effect === 'reveal')
    .sort((a,b)=> (+a.cfg.order||0) - (+b.cfg.order||0));
}
const revealCount = () => revealEls().length;

// 單選改順序＝把這一個搬到第 N 位，其他人讓位 —— 跟拖曳排序一樣的直覺。
// 只改自己的號碼會留下重號和空號（把第 5 個改成 1，就會有兩個 1、沒有 5）。
function reorderReveal(el, pos){
  const rest = revealEls().filter(x=> x.el !== el);
  const at = Math.max(0, Math.min(rest.length, (pos|0) - 1));
  rest.splice(at, 0, {el, cfg: animCfg(el) || {}});
  rest.forEach((x, i)=>{
    const c = animCfg(x.el) || {};
    c.order = i + 1;
    x.el.dataset.anim = JSON.stringify(c);
  });
}
const nextAnimOrder = () => revealCount() + 1;

// 順序徽章畫在疊層上，不碰投影片 DOM
function drawAnimOrder(){
  const host = $('#animOrder'); if(!host) return;
  const list = revealEls(), z = S.zoom;
  host.innerHTML = list.map((x, i)=>{
    if(!x.el.isConnected) return '';
    const r = x.el.getBoundingClientRect();
    const on = sels.some(s=> s.el === x.el) ? ' sel' : '';
    return `<div class="ordBadge${on}" style="left:${r.left*z}px;top:${r.top*z}px">`
         + `${x.cfg.order || i+1}</div>`;
  }).join('');
}

$('#aEffect').onchange = ()=>{
  const e = $('#aEffect').value;
  if(e === 'reveal' && +$('#aDur').value > 900) $('#aDur').value = 600;
  if(e === 'count'  && +$('#aDur').value < 900) $('#aDur').value = 1400;
  $('#aDurN').textContent = $('#aDur').value;
  applyAnim();
};
$('#aEase').onchange   = applyAnim;
$('#aDur').oninput     = ()=>{ $('#aDurN').textContent = $('#aDur').value; };
$('#aDur').onchange    = applyAnim;
$('#aDir').onchange     = applyAnim;
$('#aOrder').onchange   = ()=>{
  const p = primary(); if(!p) return;
  pushUndo();
  reorderReveal(p.el, +$('#aOrder').value || 1);
  persist(); syncAnim();
};
$('#aStagger').oninput  = ()=>{ $('#aStagN').textContent = $('#aStagger').value; };
$('#aStagger').onchange = applyAnim;
$('#aPlay').onclick    = animPreview;

// ----------------------------------------------------------------- 播放
let prIdx = 0;
function present(on){
  $('#present').classList.toggle('on', on);
  if(on){ prIdx = Math.max(0, S.slides.indexOf(S.slide)); showPr(); }
  else $('#prFrame').src = 'about:blank';
}
function showPr(){
  const name = S.slides[prIdx]; if(!name) return;
  $('#prFrame').src = '/slide/' + encodeURIComponent(name) + '?t=' + Date.now();
  $('#prNum').textContent = `${prIdx+1} / ${S.slides.length}`;
  fitPr();
}
function fitPr(){
  // 等比縮放到視窗內，底部留 34px 給狀態列
  const z = Math.min(window.innerWidth / 1280, (window.innerHeight - 34) / 720);
  const f = $('#prFrame');
  f.style.width = '1280px'; f.style.height = '720px';
  f.style.transform = `scale(${z})`;
}
window.addEventListener('resize', ()=>{ if($('#present').classList.contains('on')) fitPr(); });
$('#btnPlay').onclick = ()=> present(true);

// 編輯時 #ov 蓋在投影片上（才選得到元素），互動示範因此點不到。
// 這個開關暫時把 overlay 讓開，讓你直接操作 demo；再按一次回到編輯。
let interact = false;
$('#btnInteract').onclick = ()=>{
  interact = !interact;
  ov.style.pointerEvents = interact ? 'none' : '';
  deselect();
  $('#btnInteract').style.borderColor = interact ? 'var(--accent)' : '';
  $('#btnInteract').style.color = interact ? 'var(--accent)' : '';
  msg(interact ? '互動模式：可直接操作投影片裡的示範，選取暫停'
               : '回到編輯模式');
};

// ----------------------------------------------------------------- 匯出
$('#btnExport').onclick = async ()=>{
  const out = $('#expOut');
  out.className = ''; out.textContent = '打包中…（字體子集化要幾秒）';
  $('#btnExport').disabled = true;
  const j = await post('/api/export', {font:$('#expFont').value, nav:$('#expNav').value});
  $('#btnExport').disabled = false;
  if(j.ok){ out.className = 'ok'; out.textContent = `${j.output}（${j.kb} KB）`; }
  else { out.className = 'err'; out.textContent = j.error || '打包失敗'; }
};

// ------------------------------------------------ 外部改動時重新載入
// 只有別人（例如重跑 theme_*.py）動了檔案才會觸發。自己的存檔會從
// /api/save 的回應更新 S.stamp，所以不會誤判。
setInterval(async ()=>{
  if(textMode || drag || dirty || saving) return;
  try{
    const s = (await (await fetch('/api/stamp')).json()).stamp;
    if(S.stamp && s !== S.stamp){ S.stamp = s; msg('檔案被外部改動，重新載入','ok'); open(S.slide); }
    S.stamp = s;
  }catch(e){}
}, 1200);

setZoom(.75); load();
</script>
